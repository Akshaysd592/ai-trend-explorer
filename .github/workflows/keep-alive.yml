name: Keep Alive — Render Services

# ============================================================
# Pings all Render service health endpoints every 10 minutes
# to prevent free-tier spin-down (Render sleeps after 15 min).
#
# This workflow is a SECONDARY keep-alive.
# PRIMARY: Set up UptimeRobot (free) to ping every 5 minutes.
#   → https://uptimerobot.com
#
# GitHub Secrets required:
#   RENDER_API_GATEWAY_URL   → e.g. https://api-gateway.onrender.com
#   RENDER_AUTH_URL          → e.g. https://auth-service.onrender.com
#   RENDER_TREND_URL         → e.g. https://trend-service.onrender.com
#   RENDER_AI_ANALYSIS_URL   → e.g. https://ai-analysis-service.onrender.com
# ============================================================

on:
  schedule:
    # Every 10 minutes — well within Render's 15-min sleep threshold
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual trigger for testing

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            secret_key: RENDER_API_GATEWAY_URL
          - name: auth-service
            secret_key: RENDER_AUTH_URL
          - name: trend-service
            secret_key: RENDER_TREND_URL
          - name: ai-analysis-service
            secret_key: RENDER_AI_ANALYSIS_URL

    steps:
      - name: Ping ${{ matrix.name }} /actuator/health
        if: ${{ secrets[matrix.secret_key] != '' }}
        run: |
          SERVICE_URL="${{ secrets[matrix.secret_key] }}"
          HEALTH_URL="${SERVICE_URL}/actuator/health"

          echo "🏓 Pinging ${{ matrix.name }} at ${HEALTH_URL}"

          HTTP_STATUS=$(curl -s -o /tmp/health_response.json \
            -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            "${HEALTH_URL}" || echo "000")

          echo "HTTP Status: ${HEALTH_URL} -> ${HTTP_STATUS}"

          if [ -f /tmp/health_response.json ]; then
            cat /tmp/health_response.json
          fi

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ ${{ matrix.name }} is healthy"
          elif [ "$HTTP_STATUS" -eq 000 ]; then
            echo "⚠️ ${{ matrix.name }} did not respond — may be waking up from sleep (expected)"
          else
            echo "⚠️ ${{ matrix.name }} returned HTTP ${HTTP_STATUS}"
          fi
          # Never fail — pings are best-effort; don't block CI

      - name: Skip — URL not configured
        if: ${{ secrets[matrix.secret_key] == '' }}
        run: |
          echo "⚠️ Skipping ${{ matrix.name }} — ${{ matrix.secret_key }} secret not set."
