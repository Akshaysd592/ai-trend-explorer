name: Deploy to Render

# ============================================================
# Triggers Render deploy hooks after all CI checks pass.
# Deploy hook URLs are stored as GitHub Secrets — never in code.
#
# GitHub Secrets required (set in: Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_AUTH_SERVICE
#   RENDER_DEPLOY_HOOK_TREND_SERVICE
#   RENDER_DEPLOY_HOOK_AI_ANALYSIS_SERVICE
#   RENDER_DEPLOY_HOOK_API_GATEWAY
#   RENDER_DEPLOY_HOOK_FRONTEND
#
# Get deploy hook URLs from:
#   Render Dashboard → Service → Settings → Deploy Hooks
# ============================================================

on:
  push:
    branches:
      - main

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Wait for all CI checks to pass before deploying ──────
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: All CI checks passed — proceeding to deploy
        run: echo "CI checks verified. Starting Render deployments."

  # ── Deploy each service in parallel ──────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: check-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            secret: RENDER_DEPLOY_HOOK_AUTH_SERVICE
          - service: trend-service
            secret: RENDER_DEPLOY_HOOK_TREND_SERVICE
          - service: ai-analysis-service
            secret: RENDER_DEPLOY_HOOK_AI_ANALYSIS_SERVICE
          - service: api-gateway
            secret: RENDER_DEPLOY_HOOK_API_GATEWAY
          - service: frontend
            secret: RENDER_DEPLOY_HOOK_FRONTEND

    steps:
      - name: Trigger Render Deploy — ${{ matrix.service }}
        # Only deploy if the deploy hook secret is configured
        if: ${{ secrets[matrix.secret] != '' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets[matrix.secret] }}")

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Deploy triggered successfully for ${{ matrix.service }} (HTTP $HTTP_STATUS)"
          else
            echo "❌ Deploy hook returned unexpected status $HTTP_STATUS for ${{ matrix.service }}"
            exit 1
          fi

      - name: Skip — Deploy hook not configured
        if: ${{ secrets[matrix.secret] == '' }}
        run: |
          echo "⚠️ Skipping ${{ matrix.service }} — secret ${{ matrix.secret }} not set."
          echo "Add it in: GitHub → Settings → Secrets and variables → Actions"
