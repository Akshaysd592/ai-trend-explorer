name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Microservices CI Matrix ──────────────────────────────────────
  backend-ci:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - trend-service
          - ai-analysis-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          cd ${{ matrix.service }}
          chmod +x gradlew || true

      - name: Build & Test Microservice
        run: |
          cd ${{ matrix.service }}
          ./gradlew test --no-daemon

      - name: Assemble Boot JAR
        run: |
          cd ${{ matrix.service }}
          ./gradlew bootJar --no-daemon -x test

  # ── 2. Frontend CI ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Next.js 15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Next.js Application (Standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ── 3. Docker Image Build Validation ───────────────────────────────────────
  docker-build-check:
    name: Docker Build Check (${{ matrix.service }})
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - trend-service
          - ai-analysis-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ai-trend-explorer-${{ matrix.service }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
