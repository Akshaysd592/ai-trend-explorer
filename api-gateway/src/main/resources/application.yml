server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: trend-service
          uri: ${TREND_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/trends/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
