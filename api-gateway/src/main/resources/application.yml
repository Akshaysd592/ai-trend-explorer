server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-docs
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8082}
          predicates:
            - Path=/v3/api-docs/auth/**
          filters:
            - RewritePath=/v3/api-docs/auth(?<segment>/?.*), /v3/api-docs$\{segment}
        - id: trend-service
          uri: http://${TREND_SERVICE_HOST:localhost}:${TREND_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/trends/**
        - id: trend-docs
          uri: http://${TREND_SERVICE_HOST:localhost}:${TREND_SERVICE_PORT:8081}
          predicates:
            - Path=/v3/api-docs/trends/**
          filters:
            - RewritePath=/v3/api-docs/trends(?<segment>/?.*), /v3/api-docs$\{segment}
        - id: ai-analysis-service
          uri: http://${AI_ANALYSIS_SERVICE_HOST:localhost}:${AI_ANALYSIS_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/analysis/**
        - id: ai-analysis-docs
          uri: http://${AI_ANALYSIS_SERVICE_HOST:localhost}:${AI_ANALYSIS_SERVICE_PORT:8083}
          predicates:
            - Path=/v3/api-docs/analysis/**
          filters:
            - RewritePath=/v3/api-docs/analysis(?<segment>/?.*), /v3/api-docs$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
