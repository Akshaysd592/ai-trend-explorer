server:
  port: 8083

spring:
  application:
    name: ai-analysis-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
      fail-fast: false
    # ── Aiven Kafka — SASL_SSL + SCRAM-SHA-256 (free, no credit card) ────────
    # Set KAFKA_* vars in Render Dashboard for production.
    # Locally, KAFKA_SECURITY_PROTOCOL defaults to PLAINTEXT — SASL ignored.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_SASL_USERNAME:}\" password=\"${KAFKA_SASL_PASSWORD:}\";"
      ssl.endpoint.identification.algorithm: ""
      ssl.engine.factory.class: com.aitrend.analysis.infrastructure.config.InsecureSslEngineFactory
    consumer:
      group-id: ai-analysis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      trend-ingested: ${KAFKA_TOPIC_TREND_INGESTED:ai.trends.ingested}
  trend-service:
    url: ${TREND_SERVICE_URL:http://localhost:8081}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
