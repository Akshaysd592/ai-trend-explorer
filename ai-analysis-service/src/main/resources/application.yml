server:
  port: ${PORT:8083}

spring:
  application:
    name: ai-analysis-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_AUTO_STARTUP:false}
    consumer:
      group-id: ai-analysis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      trend-ingested: ${KAFKA_TOPIC_TREND_INGESTED:ai.trends.ingested}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

services:
  trend-service:
    url: ${TREND_SERVICE_URL:http://${TREND_SERVICE_HOST:localhost}:${TREND_SERVICE_PORT:8081}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
