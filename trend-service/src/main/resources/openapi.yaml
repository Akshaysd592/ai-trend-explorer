openapi: 3.0.3
info:
  title: Trend Service API
  description: Multi-Platform AI Trend Aggregation, Scoring, Search, and Pagination API Specification.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Direct Trend Service
  - url: http://localhost:8080
    description: API Gateway

tags:
  - name: Trends
    description: Aggregated AI repositories, open-weights models, trend scoring, search, and pagination.

paths:
  /api/v1/trends:
    get:
      tags:
        - Trends
      summary: Get paginated, filtered, and searchable AI trends
      operationId: getTrends
      parameters:
        - name: source
          in: query
          description: Filter trends by platform (e.g. GITHUB, HUGGING_FACE)
          required: false
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: language
          in: query
          description: Filter by primary programming language (e.g. Python, Go, TypeScript)
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: Search keyword matching title, description, or AI category
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Zero-based page index
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Number of items per page (1 to 100)
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          description: Property to sort by (stars, score, created, title)
          required: false
          schema:
            type: string
            default: stars
        - name: sortDir
          in: query
          description: Sort direction (asc or desc)
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated trend items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultTrendResponseDto'

    post:
      tags:
        - Trends
      summary: Create or ingest a new AI trend item
      operationId: createTrend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrendRequestDto'
      responses:
        '201':
          description: Trend item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponseDto'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/trends/{id}:
    get:
      tags:
        - Trends
      summary: Get a single AI trend by ID
      operationId: getTrendById
      parameters:
        - name: id
          in: path
          description: Unique database identifier of the trend
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Trend item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponseDto'
        '404':
          description: Trend item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    CreateTrendRequestDto:
      type: object
      required:
        - title
        - source
      properties:
        title:
          type: string
          example: ollama/ollama
        description:
          type: string
          example: Get up and running with Llama 3.1, Mistral, Gemma 2, and other LLMs locally.
        repositoryUrl:
          type: string
          example: https://github.com/ollama/ollama
        source:
          $ref: '#/components/schemas/SourceType'
        stars:
          type: integer
          example: 92450
        forks:
          type: integer
          example: 7820
        language:
          type: string
          example: Go
        topics:
          type: array
          items:
            type: string
          example: ["llm", "local-ai"]
        trendScore:
          type: number
          format: double
          example: 99.5
        aiCategory:
          type: string
          example: Local LLM Execution
        aiSummary:
          type: string
          example: High velocity repository simplifying local inferencing.

    TrendResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: ollama/ollama
        description:
          type: string
          example: Get up and running with Llama 3.1, Mistral, Gemma 2, and other LLMs locally.
        repositoryUrl:
          type: string
          example: https://github.com/ollama/ollama
        source:
          $ref: '#/components/schemas/SourceType'
        stars:
          type: integer
          example: 92450
        forks:
          type: integer
          example: 7820
        language:
          type: string
          example: Go
        topics:
          type: array
          items:
            type: string
          example: ["llm", "local-ai"]
        trendScore:
          type: number
          format: double
          example: 99.5
        aiCategory:
          type: string
          example: Local LLM Execution
        aiSummary:
          type: string
          example: High velocity repository simplifying local inferencing.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedResultTrendResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TrendResponseDto'
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 5
        totalPages:
          type: integer
          example: 1
        last:
          type: boolean
          example: true

    SourceType:
      type: string
      enum:
        - GITHUB
        - HUGGING_FACE

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: https://api.aitrend.com/errors/bad-request
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Search failed
        timestamp:
          type: string
          format: date-time
