# ============================================================
# render.yaml — AI Trend Explorer
# Render Blueprint (Infrastructure-as-Code)
#
# ⚠️  SECURITY: This file is safe to commit to a PUBLIC repo.
#     All variables marked sync: false MUST be set manually
#     in the Render Dashboard → Environment after first deploy.
#     Never put actual secret values in this file.
#
# Render Docs: https://render.com/docs/blueprint-spec
# ============================================================

databases:
  # ── Shared PostgreSQL (Render Free Tier allows 1 DB per account) ──
  - name: ai-trend-db
    databaseName: ai_trend_db
    user: ai_trend_user
    plan: free
    region: oregon

services:
  # ── Redis ────────────────────────────────────────────────
  - type: redis
    name: ai-trend-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []               # Internal access only

  # ── Auth Service ─────────────────────────────────────────
  - type: web
    name: auth-service
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: JWT_SECRET
        sync: false               # Set in Render Dashboard
      - key: SERVER_PORT
        value: "8082"

  # ── Trend Service ─────────────────────────────────────────
  - type: web
    name: trend-service
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./trend-service/Dockerfile
    dockerContext: ./trend-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-trend-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false               # Set in Render Dashboard (same value as auth-service)
      - key: GEMINI_API_KEY
        sync: false               # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      - key: GITHUB_TOKEN
        sync: false               # Set in Render Dashboard
      # ── Aiven Kafka (SASL_SSL + SCRAM-SHA-256) ─────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false               # e.g. kafka-xxxxx.aivencloud.com:26042
      - key: KAFKA_SASL_USERNAME
        sync: false               # Aiven Service User
      - key: KAFKA_SASL_PASSWORD
        sync: false               # Aiven Password
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: SERVER_PORT
        value: "8081"

  # ── AI Analysis Service ───────────────────────────────────
  - type: web
    name: ai-analysis-service
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./ai-analysis-service/Dockerfile
    dockerContext: ./ai-analysis-service
    healthCheckPath: /actuator/health
    envVars:
      - key: TREND_SERVICE_URL
        fromService:
          type: web
          name: trend-service
          property: host
      - key: GEMINI_API_KEY
        sync: false               # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      # ── Aiven Kafka (SASL_SSL + SCRAM-SHA-256) ─────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false               # Same as trend-service
      - key: KAFKA_SASL_USERNAME
        sync: false               # Same Aiven Service User
      - key: KAFKA_SASL_PASSWORD
        sync: false               # Same Aiven Password
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: SERVER_PORT
        value: "8083"

  # ── API Gateway ───────────────────────────────────────────
  - type: web
    name: api-gateway
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    healthCheckPath: /actuator/health
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          property: host
      - key: TREND_SERVICE_URL
        fromService:
          type: web
          name: trend-service
          property: host
      - key: AI_ANALYSIS_SERVICE_URL
        fromService:
          type: web
          name: ai-analysis-service
          property: host
      - key: ALLOWED_ORIGINS
        sync: false               # Set to your frontend URL e.g. https://ai-trend-explorer-frontend.onrender.com
      - key: SERVER_PORT
        value: "8080"

  # ── Frontend (Next.js) ────────────────────────────────────
  - type: web
    name: ai-trend-explorer-frontend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: host
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
