# ─────────────────────────────────────────────────────────────────────────────
# AI Trend Explorer — Render Infrastructure as Code (Blueprint)
# 100% Free Plan Compatible (Uses type: web & Free PostgreSQL + Redis)
# Security: Zero Hardcoded Secrets (Parameter-Driven)
# Cost: $0.00 / month
# ─────────────────────────────────────────────────────────────────────────────

databases:
  # ── 1. PostgreSQL Database (Free Tier) ─────────────────────────────────────
  - name: ai-trend-db
    databaseName: ai_trend_db
    user: trend_user
    plan: free
    region: oregon

services:
  # ── 2. Redis Cache (Free Tier) ─────────────────────────────────────────────
  - type: redis
    name: redis
    plan: free
    region: oregon
    ipAllowList: [] # Accessible by all services in your Render account

  # ── 3. Auth Microservice (Web Service) ─────────────────────────────────────
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: JWT_SECRET
        generateValue: true # Secure 256-bit random key generated by Render

  # ── 4. AI Analysis Microservice (Web Service) ──────────────────────────────
  - type: web
    name: ai-analysis-service
    runtime: docker
    dockerfilePath: ./ai-analysis-service/Dockerfile
    dockerContext: ./ai-analysis-service
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Prompts securely in Render UI at deploy time
      - key: GEMINI_MODEL
        value: models/gemini-3.5-flash-lite

  # ── 5. Trend Microservice (Web Service) ────────────────────────────────────
  - type: web
    name: trend-service
    runtime: docker
    dockerfilePath: ./trend-service/Dockerfile
    dockerContext: ./trend-service
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: ai-analysis-service
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: models/gemini-3.5-flash-lite
      - key: AI_ANALYSIS_SERVICE_URL
        fromService:
          type: web
          name: ai-analysis-service
          property: host

  # ── 6. API Gateway (Public Web Service) ────────────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          property: host
      - key: TREND_SERVICE_URL
        fromService:
          type: web
          name: trend-service
          property: host
      - key: AI_ANALYSIS_SERVICE_URL
        fromService:
          type: web
          name: ai-analysis-service
          property: host

  # ── 7. Next.js 15 Frontend (Public Web Service) ────────────────────────────
  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: host
