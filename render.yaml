# ─────────────────────────────────────────────────────────────────────────────
# AI Trend Explorer — Render Infrastructure as Code (Blueprint)
# 100% Free Plan Compatible (Uses type: web & Free PostgreSQL + Redis)
# Security: Zero Hardcoded Secrets (Env Var Groups)
# Cost: $0.00 / month
# ─────────────────────────────────────────────────────────────────────────────
# ============================================================
# render.yaml — AI Trend Explorer
# Render Blueprint (Infrastructure-as-Code)
#
# Render Docs: https://render.com/docs/blueprint-spec
# ============================================================

envVarGroups:
  - name: ai-shared-secrets
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Prompts securely once in Render UI at deploy time
      - key: GEMINI_MODEL
        value: models/gemini-3.5-flash-lite

databases:
  # ── 1. PostgreSQL Database (Free Tier) ─────────────────────────────────────
  # ── Shared PostgreSQL (Render Free Tier allows 1 DB per account) ──
  - name: ai-trend-db
    databaseName: ai_trend_db
    user: trend_user
    user: ai_trend_user
    plan: free
    region: oregon

services:
  # ── 2. Redis Cache (Free Tier) ─────────────────────────────────────────────
  # ── Redis ────────────────────────────────────────────────
  - type: redis
    name: redis
    name: ai-trend-redis
    plan: free
    region: oregon
    ipAllowList: [] # Accessible by all services in your Render account
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []               # Internal access only

  # ── 3. Auth Microservice (Web Service) ─────────────────────────────────────
  # ── Auth Service ─────────────────────────────────────────
  - type: web
    name: auth-service
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: DB_PORT
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: DB_NAME
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: DB_USER
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: DB_PASSWORD
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: JWT_SECRET
        generateValue: true # Secure 256-bit random key generated by Render
        sync: false               # Set in Render Dashboard
      - key: SERVER_PORT
        value: "8082"

  # ── 4. AI Analysis Microservice (Web Service) ──────────────────────────────
  # ── Trend Service ─────────────────────────────────────────
  - type: web
    name: ai-analysis-service
    runtime: docker
    dockerfilePath: ./ai-analysis-service/Dockerfile
    dockerContext: ./ai-analysis-service
    name: trend-service
    region: oregon
    plan: free
    region: oregon
    envVars:
      - fromGroup: ai-shared-secrets
      - key: TREND_SERVICE_URL
        value: http://trend-service:10000

  # ── 5. Trend Microservice (Web Service) ────────────────────────────────────
  - type: web
    name: trend-service
    runtime: docker
    dockerfilePath: ./trend-service/Dockerfile
    dockerContext: ./trend-service
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: ai-shared-secrets
      - key: DB_HOST
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: ai-trend-db
          property: host
      - key: DB_PORT
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: ai-trend-db
          property: port
      - key: DB_NAME
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: ai-trend-db
          property: database
      - key: DB_USER
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ai-trend-db
          property: user
      - key: DB_PASSWORD
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ai-trend-db
          property: password
      - key: REDIS_HOST
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port
          name: ai-trend-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false               # Set in Render Dashboard (same value as auth-service)
      - key: GEMINI_API_KEY
        sync: false               # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      - key: GITHUB_TOKEN
        sync: false               # Set in Render Dashboard
      # ── Aiven Kafka (SASL_SSL + SCRAM-SHA-256) ─────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false               # e.g. kafka-xxxxx.aivencloud.com:26042
      - key: KAFKA_SASL_USERNAME
        sync: false               # Aiven Service User
      - key: KAFKA_SASL_PASSWORD
        sync: false               # Aiven Password
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: SERVER_PORT
        value: "8081"

  # ── AI Analysis Service ───────────────────────────────────
  - type: web
    name: ai-analysis-service
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./ai-analysis-service/Dockerfile
    dockerContext: ./ai-analysis-service
    healthCheckPath: /actuator/health
    envVars:
      - key: TREND_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: AI_ANALYSIS_SERVICE_URL
        value: http://ai-analysis-service:10000
          name: trend-service
          property: host
      - key: GEMINI_API_KEY
        sync: false               # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      # ── Aiven Kafka (SASL_SSL + SCRAM-SHA-256) ─────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false               # Same as trend-service
      - key: KAFKA_SASL_USERNAME
        sync: false               # Same Aiven Service User
      - key: KAFKA_SASL_PASSWORD
        sync: false               # Same Aiven Password
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: SERVER_PORT
        value: "8083"

  # ── 6. API Gateway (Public Web Service) ────────────────────────────────────
  # ── API Gateway ───────────────────────────────────────────
  - type: web
    name: api-gateway
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://auth-service:10000
        sync: false               # Set to https://auth-service-s01r.onrender.com
      - key: TREND_SERVICE_URL
        value: http://trend-service:10000
        sync: false               # Set to https://trend-service-s01r.onrender.com
      - key: AI_ANALYSIS_SERVICE_URL
        value: http://ai-analysis-service:10000
        sync: false               # Set to https://ai-analysis-service-s01r.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false               # Set to your frontend URL e.g. https://ai-trend-explorer-frontend.onrender.com
      - key: SERVER_PORT
        value: "8080"

  # ── 7. Next.js 15 Frontend (Public Web Service) ────────────────────────────
  # ── Frontend (Next.js) ────────────────────────────────────
  - type: web
    name: frontend
    name: ai-trend-explorer-frontend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: host
        sync: false               # Set to https://api-gateway-s01r.onrender.com in Render Dashboard
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
