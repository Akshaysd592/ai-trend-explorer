# ─────────────────────────────────────────────────────────────────────────────
# AI Trend Explorer — Render Infrastructure as Code (Blueprint)
# Security: 100% Parameterized & Public-Safe (Zero Hardcoded Secrets)
# Cost: $0.00 / month (Render Free Hobby Tier)
# ─────────────────────────────────────────────────────────────────────────────

databases:
  # ── 1. Trend Database (PostgreSQL) ─────────────────────────────────────────
  - name: trend-db
    databaseName: trend_db
    user: postgres
    plan: free
    region: oregon # or ohio, frankfurt, singapore

  # ── 2. Auth Database (PostgreSQL) ──────────────────────────────────────────
  - name: auth-db
    databaseName: auth_db
    user: postgres
    plan: free
    region: oregon

services:
  # ── 3. Redis Cache ─────────────────────────────────────────────────────────
  - type: redis
    name: redis
    plan: free
    region: oregon
    ipAllowList: [] # Only accessible by internal services

  # ── 4. Apache Kafka Broker (KRaft Mode) ────────────────────────────────────
  - type: pserv # Private Service (Internal Network Only)
    name: kafka
    runtime: image
    image:
      url: apache/kafka:3.7.0
    plan: free
    region: oregon
    envVars:
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: "broker,controller"
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://:9092,CONTROLLER://:9093"
      - key: KAFKA_ADVERTISED_LISTENERS
        value: "PLAINTEXT://kafka:9092"
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: "CONTROLLER"
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: "1@kafka:9093"
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        value: "0"
      - key: KAFKA_NUM_PARTITIONS
        value: "1"

  # ── 5. Auth Microservice (Private) ─────────────────────────────────────────
  - type: pserv
    name: auth-service
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Secure 256-bit random key generated by Render

  # ── 6. Trend Microservice (Private) ────────────────────────────────────────
  - type: pserv
    name: trend-service
    runtime: docker
    dockerfilePath: ./trend-service/Dockerfile
    dockerContext: ./trend-service
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: trend-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - key: JWT_SECRET
        fromService:
          type: pserv
          name: auth-service
          envVarKey: JWT_SECRET
      - key: GEMINI_API_KEY
        sync: false # Prompts securely in Render UI at deploy time
      - key: GEMINI_MODEL
        value: models/gemini-3.5-flash-lite
      - key: AI_ANALYSIS_SERVICE_URL
        value: http://ai-analysis-service:8083

  # ── 7. AI Analysis Microservice (Private) ──────────────────────────────────
  - type: pserv
    name: ai-analysis-service
    runtime: docker
    dockerfilePath: ./ai-analysis-service/Dockerfile
    dockerContext: ./ai-analysis-service
    plan: free
    region: oregon
    envVars:
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - key: TREND_SERVICE_URL
        value: http://trend-service:8081
      - key: GEMINI_API_KEY
        fromService:
          type: pserv
          name: trend-service
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: models/gemini-3.5-flash-lite

  # ── 8. API Gateway (Public Web Service) ────────────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://auth-service:8082
      - key: TREND_SERVICE_URL
        value: http://trend-service:8081
      - key: AI_ANALYSIS_SERVICE_URL
        value: http://ai-analysis-service:8083

  # ── 9. Next.js 15 Frontend (Public Web Service) ────────────────────────────
  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: host
